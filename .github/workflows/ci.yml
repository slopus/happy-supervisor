name: ci

on:
  push:
    branches: [main, "v2/**"]
  pull_request:
  # release.yml runs the whole suite before it builds a release.
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The Linux sandbox needs bubblewrap, and on Ubuntu 24.04 an AppArmor profile that lets it
      # create user namespaces, as the installer writes (docs/policy.md).
      - name: bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -yq bubblewrap
          printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' \
            'profile bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' '}' \
            | sudo tee /etc/apparmor.d/bwrap
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-all --die-with-parent true
      - run: cargo fmt --check
      # The installers and the publish script (deploy/README.md).
      - name: deploy
        if: matrix.os == 'ubuntu-latest'
        run: |
          shellcheck deploy/install.sh deploy/publish.sh
          python3 -m unittest discover -s deploy -p 'test_*.py'
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # The control plane's library alone, so no node-only dependency leaks into it.
      - run: cargo clippy --lib --no-default-features --features control-plane -- -D warnings
      - run: cargo test --lib --no-default-features --features control-plane
      - run: cargo build --all-targets --all-features
      # The service's entry point, its own package (docs/boot.md).
      - run: cargo clippy -p happy-supervisor-boot --all-targets -- -D warnings
      - run: cargo test -p happy-supervisor-boot
      # The runner is an administrator; the tests run as the same account, as the supervisor would.
      - run: cargo run --all-features -- install-sandbox
        if: runner.os == 'Windows'
      # The policy-to-outcome table with each row's time, in the log.
      - run: cargo test --all-features --test sandbox_windows -- --nocapture
        if: runner.os == 'Windows'
      - run: cargo test --all-features
      # The workload user (identity.rs) needs a supervisor running as root.
      - name: workload user, as root
        if: runner.os != 'Windows'
        run: |
          bin=$(cargo test --all-features --test workload --no-run --message-format=json \
            | jq -r 'select(.target.name == "workload" and .executable != null) | .executable')
          sudo "$bin" --nocapture
      # System access (policy.md) for real: apt-get and npm -g on Linux, brew and npm -g on macOS
      # are refused as raw and before `system enable`, then install. The runner is thrown away.
      - name: system access installs packages, as root
        if: runner.os != 'Windows'
        run: |
          # system enable refuses a /opt that others may change; the runner's may be one.
          if [ "$RUNNER_OS" = Linux ]; then
            ls -ld /opt
            sudo chown root:root /opt
            sudo chmod 755 /opt
          fi
          bin=$(cargo test --all-features --test workload --no-run --message-format=json \
            | jq -r 'select(.target.name == "workload" and .executable != null) | .executable')
          sudo HS_TEST_PATH="$(dirname "$(command -v npm)")" "$bin" --ignored --nocapture \
            system_access_installs_packages
      # limits.memoryBytes and processes need a cgroup delegated to the supervisor: each node runs
      # in a user scope with Delegate=yes, as an installed user service would (docs/install.md).
      - name: limits, in a delegated cgroup
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          cat "/sys/fs/cgroup/user.slice/user-$(id -u).slice/user@$(id -u).service/cgroup.controllers"
          HAPPY_TEST_DELEGATED=1 cargo test --all-features --test limits -- --nocapture
      # Timing tests, alone so nothing else competes for the CPU, and in release as shipped.
      - run: cargo test --release --all-features --test e2e -- --ignored --nocapture
        if: runner.os != 'Windows'
