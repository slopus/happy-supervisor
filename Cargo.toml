[package]
name = "happy-supervisor"
version = "0.1.0"
edition = "2024"
description = "Runs commands, file operations and watches on this machine for one trusted control plane"
license = "MIT"
repository = "https://github.com/slopus/happy-supervisor"

[lib]
name = "happy_supervisor"
path = "src/lib.rs"

[[bin]]
name = "happy-supervisor"
path = "src/main.rs"

[[test]]
name = "e2e"
required-features = ["testing"]

[[test]]
name = "e2e_tunnels"
required-features = ["testing"]

[features]
testing = ["dep:axum", "yawc/axum"]

[dependencies]
tokio = { version = "1", features = ["full"] }
yawc = { version = "0.5", default-features = false, features = ["zlib"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
url = "2"
notify = "8"
sysinfo = "0.37"
cuid2 = "0.1"
uuid = { version = "1.29", features = ["v7", "serde"] }
ciborium = "0.2"
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
sha1 = "0.10"
time = "0.3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
axum = { version = "0.8", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
seccompiler = "0.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.30", features = ["signal", "process", "fs", "user"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3"
axum = "0.8"

# Compression and CBOR run optimized in test builds too, so timings there are realistic.
[profile.dev.package.zlib-rs]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.yawc]
opt-level = 3

[profile.dev.package.ciborium]
opt-level = 3

[profile.dev.package.ciborium-ll]
opt-level = 3

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
