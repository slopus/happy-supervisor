[package]
name = "happy-supervisor"
version = "0.1.0"
edition = "2024"
description = "Runs commands, file operations and watches on this machine for one trusted control plane"
license = "MIT"
repository = "https://github.com/slopus/happy-supervisor"

[workspace]
# happy-supervisor-boot (boot/, docs/boot.md): the service's entry point, which starts this binary.
members = ["boot"]

[lib]
name = "happy_supervisor"
path = "src/lib.rs"

[[bin]]
name = "happy-supervisor"
path = "src/main.rs"
required-features = ["node"]

[[test]]
name = "e2e"
required-features = ["testing"]

[[test]]
name = "e2e_tunnels"
required-features = ["testing"]

[[test]]
name = "boot"
required-features = ["testing"]

[features]
default = ["node"]
# The control plane's side of the link (api.md, Control-plane library): protocol types, the
# codec, link::Session, ws::upgrade and server::ControlPlaneLink. No node runtime.
control-plane = []
# The supervisor itself.
node = [
    "control-plane",
    "tokio/full",
    "hyper/client",
    "hyper/server",
    "dep:base64",
    "dep:clap",
    "dep:cuid2",
    "dep:hyper-util",
    "dep:landlock",
    "dep:libc",
    "dep:nix",
    "dep:notify",
    "dep:rcgen",
    "dep:reqwest",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:seccompiler",
    "dep:sha1",
    "dep:sysinfo",
    "dep:time",
    "dep:tokio-rustls",
    "dep:tracing-subscriber",
    "dep:url",
    "dep:windows-sys",
]
testing = ["node", "dep:axum", "yawc/axum"]

[dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
yawc = { version = "0.5", default-features = false, features = ["zlib"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = { version = "0.22", optional = true }
thiserror = "2"
clap = { version = "4", features = ["derive"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"], optional = true }
url = { version = "2", optional = true }
notify = { version = "8", optional = true }
sysinfo = { version = "0.37", optional = true }
cuid2 = { version = "0.1", optional = true }
uuid = { version = "1.29", features = ["v7", "serde"] }
ciborium = "0.2"
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1"] }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
sha1 = { version = "0.10", optional = true }
time = { version = "0.3", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
axum = { version = "0.8", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = { version = "0.4", optional = true }
seccompiler = { version = "0.5", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }
nix = { version = "0.30", features = ["signal", "process", "fs", "user", "socket", "uio"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_NetworkManagement_NetManagement",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_System_Rpc",
    "Win32_System_Pipes",
    "Win32_System_Environment",
    "Win32_Networking_WinSock",
    "Win32_System_SystemServices",
    "Win32_System_Memory",
] }

[dev-dependencies]
tempfile = "3"
axum = "0.8"

# Compression and CBOR run optimized in test builds too, so timings there are realistic.
[profile.dev.package.zlib-rs]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.yawc]
opt-level = 3

[profile.dev.package.ciborium]
opt-level = 3

[profile.dev.package.ciborium-ll]
opt-level = 3

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
